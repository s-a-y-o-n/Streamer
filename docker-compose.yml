services:

  postgres:
    image: postgres:16
    container_name: video_streamer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: videouser
      POSTGRES_PASSWORD: videopassword
      POSTGRES_DB: videodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: video_streamer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: