<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Streamer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        video {
            width: 100%;
            max-width: 800px;
        }
    </style>
</head>

<body>

    <h1>Video Streamer</h1>

    <video controls>
        <source
            src="http://127.0.0.1:8000/videos/1/stream"
            type="video/mp4"
        >

        Your browser does not support video playback.
    </video>

</body>
</html>
